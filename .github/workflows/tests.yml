name: tests

on:
  push:
    branches:
      - main
      - 2.x
  pull_request:

jobs:
  package-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '^10.0'
            testbench: '^8.0'
            php: '8.1'
          - laravel: '^10.0'
            testbench: '^8.0'
            php: '8.2'
          - laravel: '^11.0'
            testbench: '^9.0'
            php: '8.2'
          - laravel: '^12.0'
            testbench: '^10.0'
            php: '8.2'
          - laravel: '^13.0'
            testbench: '^11.0'
            php: '8.3'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer metadata
        run: composer validate --strict

      - name: Install matrix dependencies
        run: |
          composer require --no-interaction --prefer-dist --with-all-dependencies \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/view:${{ matrix.laravel }}"

          composer require --dev --no-interaction --prefer-dist --with-all-dependencies \
            "orchestra/testbench:${{ matrix.testbench }}"

      - name: Run test suite
        run: composer test

  lowest-dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Validate composer metadata
        run: composer validate --strict

      - name: Install lowest supported dependencies
        run: |
          composer require --no-interaction --prefer-dist --with-all-dependencies \
            "illuminate/contracts:^10.0" \
            "illuminate/support:^10.0" \
            "illuminate/view:^10.0"

          composer require --dev --no-interaction --prefer-dist --with-all-dependencies \
            "orchestra/testbench:^8.0"

          composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction

      - name: Run lowest dependency test suite
        run: composer test
