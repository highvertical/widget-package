name: tests

on:
  push:
    branches:
      - main
      - 1.x
  pull_request:

jobs:
  package-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.2'
            illuminate: '^7.0'
            testbench: '^5.0'
          - php: '7.3'
            illuminate: '^7.0'
            testbench: '^5.0'
          - php: '7.4'
            illuminate: '^7.0'
            testbench: '^5.0'
          - php: '7.3'
            illuminate: '^8.0'
            testbench: '^6.0'
          - php: '7.4'
            illuminate: '^8.0'
            testbench: '^6.0'
          - php: '8.0'
            illuminate: '^8.0'
            testbench: '^6.0'
          - php: '8.0'
            illuminate: '^9.0'
            testbench: '^7.0'
          - php: '8.1'
            illuminate: '^9.0'
            testbench: '^7.0'
          - php: '8.2'
            illuminate: '^9.0'
            testbench: '^7.0'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer metadata
        run: composer validate --strict

      - name: Install matrix dependencies
        run: |
          composer require --no-interaction --prefer-dist --with-all-dependencies \
            "illuminate/contracts:${{ matrix.illuminate }}" \
            "illuminate/support:${{ matrix.illuminate }}" \
            "illuminate/view:${{ matrix.illuminate }}"

          composer require --dev --no-interaction --prefer-dist --with-all-dependencies \
            "orchestra/testbench:${{ matrix.testbench }}"

      - name: Run test suite
        run: composer test

  lowest-dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.2'
          coverage: none
          tools: composer:v2

      - name: Validate composer metadata
        run: composer validate --strict

      - name: Install lowest supported dependencies
        run: |
          composer require --no-interaction --prefer-dist --with-all-dependencies \
            "illuminate/contracts:^7.0" \
            "illuminate/support:^7.0" \
            "illuminate/view:^7.0"

          composer require --dev --no-interaction --prefer-dist --with-all-dependencies \
            "orchestra/testbench:^5.0"

          composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction

      - name: Run lowest dependency test suite
        run: composer test
